@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#151B20; --card:#1E262D; --ink:#E7ECEF; --sub:#9AA8B2; --rule:#34414B;
    --steel:#8FB3CE; --signal:#F2B630; --signal-bg:#3A2F12; --warn:#F2B8B5; --warn-bg:#3B1F1D; --focus:#7DB8EA; --gray-btn:#46525C; --gray-btn-top:#57646E; --gray-btn-bottom:#39434B; --gray-border:#1E252B; --drop-bg:#1F3326; --logo-glow:rgba(255,255,255,.85); --accent:#C9431F; --yel-btn:#F2C94C; --yel-btn-hover:#E8B92A; --yel-border:#A87F00; --slot-border:#6B7680; --err-red:#FF5A55; --err-bg:#3B1F1D; --err-line:#7A3330; --err-text:#FFB4AE; --accent-dark:#8A2A10; --bg-shade:linear-gradient(rgba(21,27,32,.82),rgba(21,27,32,.82));
  }
}
:root[data-theme="dark"]{
  --paper:#151B20; --card:#1E262D; --ink:#E7ECEF; --sub:#9AA8B2; --rule:#34414B;
  --steel:#8FB3CE; --signal:#F2B630; --signal-bg:#3A2F12; --warn:#F2B8B5; --warn-bg:#3B1F1D; --focus:#7DB8EA; --gray-btn:#46525C; --gray-btn-top:#57646E; --gray-btn-bottom:#39434B; --gray-border:#1E252B; --drop-bg:#1F3326; --logo-glow:rgba(255,255,255,.85); --accent:#C9431F; --yel-btn:#F2C94C; --yel-btn-hover:#E8B92A; --yel-border:#A87F00; --slot-border:#6B7680; --err-red:#FF5A55; --err-bg:#3B1F1D; --err-line:#7A3330; --err-text:#FFB4AE; --accent-dark:#8A2A10; --bg-shade:linear-gradient(rgba(21,27,32,.82),rgba(21,27,32,.82));
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background-color:var(--paper);background-image:var(--bg-shade),var(--bg-flowers);background-repeat:repeat;background-size:auto,420px 420px;background-attachment:fixed;color:var(--ink);
  font-family:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",sans-serif;
  font-size:15px;line-height:1.7}
main{max-width:1040px;min-width:900px;margin:0 auto;padding:.9rem 2rem .75rem}
h1{text-shadow:0 0 4px var(--paper),0 0 8px var(--paper),0 0 12px var(--paper);font-size:2.4rem;line-height:1.15;letter-spacing:.04em;line-height:1.3;margin:0 0 .7rem;color:var(--steel)}
.lead{color:var(--sub);margin:0 0 1.75rem;max-width:60ch}
.rule{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--rule);
  border-radius:6px;background:var(--card);margin-bottom:1.5rem;overflow:hidden}
.rule div{padding:.75rem 1rem;border-right:1px solid var(--rule)}
.rule div:last-child{border-right:0}
.rule b{display:block;font-size:1rem}
.rule span{color:var(--sub);font-size:.85rem}
.drop{position:relative;display:flex;align-items:center;gap:1.25rem;border:2px dashed var(--rule);border-radius:10px;
  background:var(--drop-bg);padding:.75rem 1.5rem;min-height:clamp(4.5rem,13vh,13.5rem);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--signal);background:var(--signal-bg)}
.drop:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.tri{flex:none;width:64px;height:56px}
.tri path{fill:var(--signal)}
.drop strong{display:block;font-size:1.1rem}
.drop small{color:var(--sub)}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.settings{display:none}
.settings label{display:flex;flex-direction:column;font-size:.85rem;color:var(--sub);gap:.25rem}
.settings input,.settings select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);
  border-radius:6px;padding:.4rem .6rem;min-width:0}
.settings input:focus,.settings select:focus,button:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
#kw{width:14rem}
.ym{display:flex;gap:.4rem;align-items:center;color:var(--ink)}
.ym input{width:5.5rem}
#result{margin-top:2rem}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem;margin-bottom:.75rem}
.count{font-size:1rem}
.count b{font-size:1.5rem;color:var(--steel);margin-right:.15rem}
.count span{color:var(--sub);margin-left:1rem;font-size:.9rem}
button{font:inherit;font-weight:700;border:0;border-radius:6px;padding:.65rem 1.25rem;cursor:pointer;
  background:var(--steel);color:var(--card)}
button:disabled{opacity:.5;cursor:not-allowed}
.note{border-radius:6px;padding:.6rem .9rem;margin:.5rem 0;font-size:.9rem}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.note.info{background:var(--signal-bg);color:var(--ink)}
.tablewrap{overflow-x:auto;border:1px solid var(--rule);border-radius:6px;background:var(--card);max-height:60vh;overflow-y:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:.45rem .8rem;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--steel);color:var(--card);font-weight:700}
td.date{text-align:center}
td.wrap{white-space:normal;min-width:9rem}
tr.nomark td{background:var(--warn-bg)}
td.src{color:var(--sub);font-size:.8rem}
details{margin-top:1rem;color:var(--sub);font-size:.9rem}
summary{cursor:pointer}
[hidden]{display:none!important}
.save-dlg{position:fixed;inset:0;z-index:200;background:rgba(20,26,32,.45);display:flex;align-items:center;justify-content:center;padding:1rem}
.save-box{width:min(560px,100%);background:var(--card);border:2px solid var(--steel);border-radius:10px;padding:1.1rem 1.3rem 1rem;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.save-title{font-size:1.2rem;font-weight:700;color:var(--steel);margin-bottom:.7rem}
.save-info{margin-bottom:.6rem}
.save-info .note{margin:.3rem 0}
.save-count{font-size:1rem}
.save-count b{font-size:1.3rem;color:var(--steel);margin-right:.1rem}
.save-label{display:block;font-weight:700;font-size:.95rem;margin-bottom:.25rem}
.save-row{display:flex;align-items:center;gap:.4rem}
.save-row input{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--ink);background:var(--card);border:2px solid var(--slot-border);border-radius:6px;padding:.4rem .6rem}
.save-row input:focus{outline:3px solid var(--focus);outline-offset:1px;border-color:var(--steel)}
.save-ext{font-weight:700;color:var(--sub)}
.save-msg{min-height:1.3rem;font-size:.9rem;margin-top:.25rem;color:var(--sub)}
.save-msg.ng{color:var(--err-red);font-weight:700}
.save-note{font-size:.85rem;color:var(--sub);background:var(--paper);border-radius:6px;padding:.5rem .7rem;line-height:1.6}
.save-actions{display:flex;justify-content:flex-end;gap:.6rem;margin-top:.9rem}
.save-cancel{background:var(--gray-btn);color:var(--ink);border:1px solid var(--gray-border);padding:.45rem 1.2rem}
.save-ok{background:var(--steel);color:#FFFFFF;padding:.45rem 1.8rem;letter-spacing:.1em}
.saved{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:210;background:#1E7B3C;color:#FFFFFF;font-weight:700;padding:.6rem 1.2rem;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.25)}


.actions.right{justify-content:flex-end;align-items:center;gap:.6rem}
.fhint{font-size:.9rem;font-weight:700;color:#D11F1F;white-space:nowrap;text-shadow:0 0 3px #FFFFFF,0 0 6px #FFFFFF,0 0 9px #FFFFFF}
.actions.right .bigbtn{width:calc(50% - .225rem)}
#fclear{padding:.2rem 1rem;font-size:1.08rem;line-height:1.5;letter-spacing:.12em;font-weight:700;color:#111111;background:var(--yel-btn);border:1px solid var(--yel-border);border-radius:6px;box-shadow:none;transform:none;transition:background .15s}
#fclear:not(:disabled):hover{filter:none;background:var(--yel-btn-hover)}
#fclear:not(:disabled):active{transform:none;box-shadow:none;background:var(--yel-btn-hover)}
#fclear:disabled{box-shadow:none;color:#5C5236}
.slot .pick{all:unset;box-sizing:border-box;display:flex;align-items:center;width:100%;cursor:pointer;border-radius:4px}
.slot .pick:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.slot:not(.empty):hover{border-color:var(--steel)}
.slot.picked{border:2px solid var(--accent-dark);background:var(--accent)}
.slot.picked .name{color:#FFFFFF}
#err{margin-top:.6rem;background:var(--err-bg);border:2px solid var(--err-red);border-radius:8px;padding:.55rem .8rem .65rem;color:var(--ink)}
.err-title{display:flex;align-items:center;gap:.45rem;font-weight:700;font-size:1.05rem;color:var(--err-red);margin-bottom:.35rem}
.err-title svg{flex:none}
.err-item{background:var(--card);border:1px solid var(--err-line);border-radius:6px;padding:.35rem .75rem;margin-top:.35rem;line-height:1.55}
.err-cause{font-weight:700;color:var(--err-text)}
.err-detail{margin:.15rem 0 0;padding-left:1.2rem;color:var(--err-text);font-size:.92rem}
.err-fix{color:var(--ink);font-size:.92rem;margin-top:.1rem}
.err-actions{display:flex;justify-content:flex-end;margin-top:.5rem}
.err-ok{min-width:7rem;padding:.3rem 1.5rem;font-size:1rem;letter-spacing:.1em;background:var(--err-red);color:#FFFFFF;border:1px solid var(--err-red);border-radius:6px}
.err-ok:hover{filter:brightness(.92)}
.slot.invalid{border:2px solid var(--warn);background:var(--warn-bg)}
.title{display:flex;align-items:center;gap:.6rem}
.title .logo{height:2.1rem;width:auto;display:block;
  filter:drop-shadow(0 0 3px var(--logo-glow)) drop-shadow(0 0 6px var(--logo-glow))}
.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem;margin-top:.45rem}
.slot{border:1px solid var(--slot-border);border-radius:8px;background:var(--card);padding:.25rem .8rem;min-width:0;min-height:2.35rem;
  display:flex;flex-direction:column;justify-content:center;gap:.3rem;line-height:1.4}
.slot.empty{border-style:solid;color:var(--sub);justify-content:center}
.slot .head{display:flex;align-items:center;gap:.5rem;min-width:0}
.slot .no{flex:none;font-weight:700;color:var(--steel)}
.slot .name{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:700;font-size:1rem}
.slot .x{flex:none;background:transparent;color:var(--sub);border:1px solid var(--rule);padding:.15rem .6rem;font-weight:400}
.slot select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:.3rem .5rem;max-width:100%}
.slot .meta{font-size:.85rem;color:var(--sub)}
.actions{display:flex;justify-content:center;margin-top:.55rem}
.bigbtn{width:100%;font-size:1.05rem;padding:.45rem 2rem;color:var(--ink);
  border:2px solid var(--gray-border);border-radius:8px;
  background:linear-gradient(to bottom,var(--gray-btn-top),var(--gray-btn) 55%,var(--gray-btn-bottom));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 4px 0 var(--gray-border),0 6px 10px rgba(0,0,0,.18);
  transform:translateY(0);transition:transform .08s,box-shadow .08s,filter .15s}
.bigbtn:not(:disabled):hover{filter:brightness(.96)}
.bigbtn:not(:disabled):active{transform:translateY(3px);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.18),0 1px 0 var(--gray-border),0 2px 4px rgba(0,0,0,.15)}
.bigbtn:disabled{opacity:1;color:var(--sub);box-shadow:0 4px 0 var(--gray-border)}
.actions{margin-bottom:.5rem}
.machine{margin-top:.55rem}
.mbox{position:relative}
.mclear{position:absolute;right:.75rem;bottom:.6rem;font-size:.9rem;padding:.3rem 1.4rem;color:var(--ink);
  border:2px solid var(--gray-border);border-radius:6px;
  background:linear-gradient(to bottom,var(--gray-btn-top),var(--gray-btn) 55%,var(--gray-btn-bottom));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 3px 0 var(--gray-border),0 4px 8px rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s}
.mclear:hover{filter:brightness(.96)}
.mclear:active{transform:translateY(2px);box-shadow:inset 0 2px 4px rgba(0,0,0,.18),0 1px 0 var(--gray-border)}
.machine h2{display:inline-block;font-size:1.35rem;line-height:1.3;letter-spacing:.08em;color:#FFFFFF;background:var(--accent);padding:.15rem .9rem .15rem .75rem;border-radius:6px;margin:0 0 .35rem;box-shadow:0 2px 0 var(--accent-dark),0 3px 6px rgba(0,0,0,.18);border-left:6px solid var(--accent-dark)}
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 .75rem;border:1px solid var(--rule);border-radius:8px;background:var(--card);padding:.4rem .6rem}
.mcol{display:flex;flex-direction:column;gap:.1rem;min-width:0}
.opt{display:flex;align-items:center;gap:.6rem;padding:.15rem .6rem;border-radius:6px;cursor:pointer;min-height:1.5rem;line-height:1.25}
.opt:hover{background:var(--paper)}
.opt input{appearance:none;-webkit-appearance:none;flex:none;width:1.15rem;height:1.15rem;margin:0;border:2px solid var(--gray-border);
  border-radius:50%;background:var(--card);display:grid;place-content:center;cursor:pointer}
.opt input::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--steel);transform:scale(0);transition:transform .1s}
.opt input:checked{border-color:var(--steel)}
.opt input:checked::before{transform:scale(1)}
.opt input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.opt:has(input:checked){background:var(--drop-bg);font-weight:700}
.opt.blank{cursor:default;color:var(--sub)}
.opt.blank:hover{background:transparent}
.opt.blank input{opacity:.35;cursor:default}
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:color-mix(in srgb,var(--paper) 82%,transparent);pointer-events:none;
  padding:calc(1rem + env(safe-area-inset-top,0px)) 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
.overlay .box{width:100%;height:100%;border:4px dashed var(--signal);border-radius:16px;background:var(--signal-bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center}
.overlay .tri{width:96px;height:84px}
.overlay strong{font-size:1.4rem}
.overlay small{color:var(--sub)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
// ==== core extraction logic ====
function extractJIT(XLSX, ws, opts) {
  const FIRST_DATE_COL = 15; // P (0-based)
  const DATE_ROW = 5;        // 6行目 (0-based)
  const MONTH_ROW = 4;       // 5行目
  const FIRST_DATA_ROW = 6;  // 7行目
  const COL_A = 0, COL_D = 3, COL_F = 5;
  const ref = ws['!ref'];
  if (!ref) return { error: 'シートにデータがありません。' };
  const range = XLSX.utils.decode_range(ref);
  const val = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; return cell ? cell.v : undefined; };
  const txt = (v) => (v === undefined || v === null) ? '' : String(v).trim();
  // A列（生産月）：結合セルの範囲内の行は、結合セル（左上）の表示どおりの値を使う
  const merges = ws['!merges'] || [];
  const shownMerged = (r, c) => {
    const m = merges.find(g => r >= g.s.r && r <= g.e.r && c >= g.s.c && c <= g.e.c);
    const cell = ws[XLSX.utils.encode_cell(m ? m.s : { r, c })];
    return cell ? String(cell.w !== undefined ? cell.w : cell.v).trim() : '';
  };

  // 生産年月（A2 など）を探す
  let prodYear = opts.year, prodMonth = opts.month;
  if (!prodYear || !prodMonth) {
    outer: for (let r = 0; r <= Math.min(range.e.r, 4); r++) {
      for (let c = 0; c <= Math.min(range.e.c, 10); c++) {
        const m = txt(val(r, c)).match(/(\d{4})\s*年\s*(\d{1,2})\s*月/);
        if (m) { prodYear = prodYear || +m[1]; prodMonth = prodMonth || +m[2]; break outer; }
      }
    }
  }

  // 日付列ごとの月を決める
  const cols = [];
  for (let c = FIRST_DATE_COL; c <= range.e.c; c++) {
    const raw = val(DATE_ROW, c);
    let day = null;
    if (raw instanceof Date) day = raw.getDate();
    else if (typeof raw === 'number') day = Math.round(raw);
    else { const m = txt(raw).match(/^(\d{1,2})$/); if (m) day = +m[1]; }
    if (day === null || day < 1 || day > 31) continue;
    const lab = txt(val(MONTH_ROW, c)).match(/(\d{1,2})\s*月/);
    cols.push({ c, day, label: lab ? +lab[1] : null });
  }
  if (!cols.length) return { error: '6行目（P列以降）に日付が見つかりません。' };

  const firstLabelIdx = cols.findIndex(x => x.label);
  let cur;
  if (firstLabelIdx === 0) cur = cols[0].label;
  else if (firstLabelIdx > 0) {
    // ラベルより前の列: ラベル月から日付の切り替わり回数だけ戻す
    let resets = 0;
    for (let i = 1; i <= firstLabelIdx; i++) if (cols[i].day < cols[i - 1].day) resets++;
    cur = ((cols[firstLabelIdx].label - 1 - resets) % 12 + 12) % 12 + 1;
  } else cur = prodMonth || 1;
  const monthOf = {};
  cols.forEach((x, i) => {
    if (x.label) cur = x.label;
    else if (i > 0 && x.day < cols[i - 1].day) cur = cur % 12 + 1;
    monthOf[x.c] = cur;
  });
  const dayOf = {}; cols.forEach(x => dayOf[x.c] = x.day);
  const baseYear = prodYear || new Date().getFullYear();
  const yearFor = (m) => (prodMonth && m > prodMonth) ? baseYear - 1 : baseYear;
  // 生産月（A列）を「YYYY年M月」にする。A列に年が無いときは、本アプリで処理を実行した日（今日）の年を使い、
  // 実行月が5月以降なら A列の1〜4月は翌年、5〜12月は当年（実行月が1〜4月なら全て当年）
  const runDate = opts.today || new Date();
  const fmtMonth = (s) => {
    const t = s.normalize('NFKC');
    let m = t.match(/(\d{4})\D+(\d{1,2})/);
    if (m) return `${+m[1]}年${+m[2]}月`;
    m = t.match(/^(\d{1,2})\s*月?$/);
    if (!m) return s;
    const mon = +m[1];
    let y = runDate.getFullYear();
    if (runDate.getMonth() + 1 >= 5 && mon <= 4) y++;
    return `${y}年${mon}月`;
  };

  const kws = (opts.exclude || '').split(/[,、，\s]+/).map(s => s.trim().toUpperCase()).filter(Boolean);
  const rows = [], excluded = [], noMark = [];
  for (let r = FIRST_DATA_ROW; r <= range.e.r; r++) {
    const d = txt(val(r, COL_D)), f = txt(val(r, COL_F));
    if (!d && !f) continue;
    if (opts.prefix) {
      const head = d.normalize('NFKC').trim().slice(0, opts.prefix.length).toUpperCase();
      if (head !== opts.prefix.toUpperCase()) { excluded.push({ row: r + 1, model: d, serial: f, reason: `左から${opts.prefix.length}文字が「${opts.prefix}」ではない` }); continue; }
    }
    const hit = kws.find(k => d.normalize('NFKC').toUpperCase().includes(k));
    if (hit) { excluded.push({ row: r + 1, model: d, serial: f, reason: `「${hit}」を含む` }); continue; }
    let jit = null;
    for (const x of cols) {
      if (txt(val(r, x.c)).includes('▲')) {
        const m = monthOf[x.c];
        jit = new Date(yearFor(m), m - 1, dayOf[x.c]);
        break;
      }
    }
    const item = { row: r + 1, month: fmtMonth(shownMerged(r, COL_A)), model: d, serial: f, jit };
    if (!jit) noMark.push(item);
    rows.push(item);
  }
  return { rows, excluded, noMark, prodYear, prodMonth };
}

// 複合機（EML・ACIES日程表）：3行目が見出し、6行目以降がデータ、W列以降が日程（3行目=○年○月、5行目=日）
// A列=アマダ生産月、F列=機種名、H列=シリアル、I列=顧客名（H・I・Aは表示どおりの文字で出力）
// 制御盤納期=「本4」の最も右の列の日付、モーター納期=「本3」の最も右の列の日付
const FUKUGO = { HEAD_ROW: 2, DAY_ROW: 4, FIRST_DATA_ROW: 5, FIRST_DATE_COL: 22, A: 0, F: 5, H: 7, I: 8 };
const norm = v => (v === undefined || v === null) ? '' : String(v).normalize('NFKC').trim();
function fukugoDateCols(XLSX, ws, range) {
  const val = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; return cell ? cell.v : undefined; };
  const cols = {};
  let y = null, m = null, prev = 0;
  for (let c = FUKUGO.FIRST_DATE_COL; c <= range.e.c; c++) {
    const head = norm(val(FUKUGO.HEAD_ROW, c)).match(/(\d{4})\s*年\s*(\d{1,2})\s*月/);
    const raw = val(FUKUGO.DAY_ROW, c);
    let day = null;
    if (raw instanceof Date) day = raw.getDate();
    else if (typeof raw === 'number') day = Math.round(raw);
    else { const t = norm(raw).match(/^(\d{1,2})$/); if (t) day = +t[1]; }
    if (head) { y = +head[1]; m = +head[2]; }
    else if (y && day && day < prev) { m++; if (m > 12) { y++; m = 1; } } // 見出しなしで日が戻ったら翌月
    if (!y || !day || day < 1 || day > 31) continue;
    cols[c] = new Date(y, m - 1, day); prev = day;
  }
  return cols;
}
function validateFukugo(XLSX, ws){
  const errs = [];
  if (!ws || !ws['!ref']) return ['シートにデータがありません。'];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const val = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; return cell ? cell.v : undefined; };
  const W = FUKUGO.FIRST_DATE_COL;
  // 項目：3行目の見出し
  const heads = [[FUKUGO.A, 'A', '生産年月'], [FUKUGO.F, 'F', '機種名'], [FUKUGO.H, 'H', 'SER.']];
  const miss = heads.filter(([c, , w]) => !norm(val(FUKUGO.HEAD_ROW, c)).toUpperCase().includes(w));
  if (miss.length) errs.push(`項目の定義：3行目に見出し（${miss.map(([, l, w]) => `${l}列「${w === 'SER.' ? 'Ser.' : w}」`).join('、')}）がありません。`);
  // 列：W列以降があること
  if (range.e.c < W) { errs.push('列の定義：W列以降に日程の列がありません。'); return errs; }
  // 行：3行目のW列以降に「○年○月」、5行目のW列以降に日付
  let ym = 0, days = 0;
  for (let c = W; c <= range.e.c; c++) {
    if (/\d{4}\s*年\s*\d{1,2}\s*月/.test(norm(val(FUKUGO.HEAD_ROW, c)))) ym++;
    const v = val(FUKUGO.DAY_ROW, c);
    if (v instanceof Date || (typeof v === 'number' && v >= 1 && v <= 31) || /^\d{1,2}$/.test(norm(v))) days++;
  }
  if (!ym) errs.push('行の定義：3行目（W列以降）に年月（「○年○月」）がありません。');
  if (!days) errs.push('行の定義：5行目（W列以降）に日付がありません。');
  // 列：6行目以降のF列に機種名、項目：W列以降に「本4」「本3」
  let fCnt = 0, marks = 0;
  for (let r = FUKUGO.FIRST_DATA_ROW; r <= range.e.r; r++) {
    if (norm(val(r, FUKUGO.F))) fCnt++;
    for (let c = W; c <= range.e.c && !marks; c++) if (/^本[34]$/.test(norm(val(r, c)))) marks++;
  }
  if (!fCnt) errs.push('列の定義：6行目以降のF列に機種名がありません。');
  if (!marks) errs.push('項目の定義：W列以降に「本4」「本3」が1つもありません。');
  return errs;
}
function extractFukugo(XLSX, ws){
  if (!ws || !ws['!ref']) return { error: 'シートにデータがありません。' };
  const range = XLSX.utils.decode_range(ws['!ref']);
  const cellAt = (r, c) => ws[XLSX.utils.encode_cell({ r, c })];
  const shown = (r, c) => { const cell = cellAt(r, c); if (!cell) return ''; return String(cell.w !== undefined ? cell.w : cell.v).trim(); };
  const dates = fukugoDateCols(XLSX, ws, range);
  const rows = [], noMark = [];
  let ymKey = 0, prodYear = null, prodMonth = null;
  for (let r = FUKUGO.FIRST_DATA_ROW; r <= range.e.r; r++) {
    const model = shown(r, FUKUGO.F);
    if (!model) continue; // F列が空欄の行は対象外
    let p4 = null, p3 = null;
    for (let c = FUKUGO.FIRST_DATE_COL; c <= range.e.c; c++) {
      const v = norm(cellAt(r, c) && cellAt(r, c).v);
      if (v === '本4') p4 = c;
      if (v === '本3') p3 = c;
    }
    const item = { row: r + 1, month: shown(r, FUKUGO.A), model, serial: shown(r, FUKUGO.H), customer: shown(r, FUKUGO.I),
      panel: p4 !== null ? dates[p4] || null : null, motor: p3 !== null ? dates[p3] || null : null };
    if (!item.panel || !item.motor) noMark.push(item);
    rows.push(item);
    const ym = item.month.match(/(\d{4})\D+(\d{1,2})/);
    if (ym && (!ymKey || +ym[1] * 12 + +ym[2] < ymKey)) { ymKey = +ym[1] * 12 + +ym[2]; prodYear = +ym[1]; prodMonth = +ym[2]; }
  }
  return { rows, excluded: [], noMark, prodYear, prodMonth };
}

// Excelの列幅の単位（半角1文字=1）で文字の幅を見積もる。印刷時（改ページプレビューの自動調整）でも切れないよう、半角・半角カナ=1.25、全角=2.4 で見積もる
function textWidth(v) {
  let w = 0;
  for (const ch of String(v)) {
    const c = ch.codePointAt(0);
    w += (c <= 0xFF || (c >= 0xFF61 && c <= 0xFF9F)) ? 1.25 : 2.4;
  }
  return w;
}
// 列の値：value があればファイルから読まずに全行その値（固定値）、無ければ抽出した値
const colVal = (c, x) => c.value !== undefined ? c.value : x[c.key];
function buildWorkbook(XLSX, rows, proc) {
  const cols = proc.columns;
  const aoa = [cols.map(c => c.label)];
  rows.forEach(x => aoa.push(cols.map(c => c.date ? (colVal(c, x) || null) : (colVal(c, x) ?? ''))));
  const ws = XLSX.utils.aoa_to_sheet(aoa, { cellDates: true });
  cols.forEach((col, ci) => {
    if (!col.date) return;
    for (let i = 1; i <= rows.length; i++) {
      const cell = ws[XLSX.utils.encode_cell({ r: i, c: ci })];
      if (cell && cell.t === 'd') cell.z = 'yyyy/m/d';
    }
  });
  // 列幅：見出しと全データのうち最も長い文字に合わせる（全ての文字が表示され、印刷でも切れない）
  // 見出しはフィルターの▼ボタンの分（+2）を足す。全体の幅は setA4Print の「横1ページに収める」で印刷範囲内に縮小される
  ws['!cols'] = cols.map(c => ({ wch: Math.min(255, Math.ceil(Math.max(textWidth(c.label) + 2,
    ...rows.map(x => textWidth(c.date ? fmt(colVal(c, x)) : (colVal(c, x) ?? '')))) + 3)) }));
  ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: rows.length, c: cols.length - 1 } }) };
  ws['!margins'] = { left: 0.4, right: 0.4, top: 0.6, bottom: 0.6, header: 0.3, footer: 0.3 };
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, proc.outName);
  // 印刷時に1行目（見出し）を各ページの先頭に出す
  wb.Workbook = { Names: [{ Name: '_xlnm.Print_Titles', Sheet: 0, Ref: `'${proc.outName}'!$1:$1` }] };
  return setA4Print(XLSX, XLSX.write(wb, { type: 'array', bookType: 'xlsx', cellDates: true }));
}
// 印刷設定：A4縦・横幅を1ページに収める（縦は自動）・フッターにページ番号
// SheetJS（無償版）は用紙設定を書き出せないため、できたxlsx（zip）のシートXMLに直接書き足す
function setA4Print(XLSX, data) {
  try {
    const zip = XLSX.CFB.read(new Uint8Array(data), { type: 'buffer' });
    const ent = XLSX.CFB.find(zip, '/xl/worksheets/sheet1.xml');
    if (!ent) return data;
    let xml = new TextDecoder().decode(ent.content);
    if (/<sheetPr[\s>\/]/.test(xml)) xml = xml.replace(/<sheetPr(\s[^>]*)?\/>/, '<sheetPr$1><pageSetUpPr fitToPage="1"/></sheetPr>');
    else xml = xml.replace(/(<worksheet[^>]*>)/, '$1<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>');
    xml = xml.replace(/(<pageMargins[^>]*\/>)/, '$1<pageSetup paperSize="9" orientation="portrait" fitToWidth="1" fitToHeight="0"/><headerFooter><oddFooter>&amp;C&amp;P / &amp;N</oddFooter></headerFooter>');
    ent.content = new TextEncoder().encode(xml); ent.size = ent.content.length;
    return XLSX.CFB.write(zip, { fileType: 'zip', type: 'array' });
  } catch (e) { return data; } // 失敗しても印刷設定なしで保存できるようにする
}

const $ = id => document.getElementById(id);
const MAX_FILES = 4;
// 機種ごとの処理方法。ここに登録した機種だけ抽出できる
// validate: ファイルが機種の定義（行・列・項目）に合っているかを調べ、合わない点を返す
// columns: 画面とExcelに出す列（date=日付列、need=空欄なら色付き行にする）、outName: シート名・保存名に使う名前
// allSheets: true ならファイル内のすべてのシートを読んで1つの表にまとめる
const PROCESSORS = {
  'HRB　土岐': {
    allSheets: true, // 月ごとにシートが分かれることが多いため、全シートを同じ処理で読んで1つの帳票にまとめる
    sortKey: 'jit',  // まとめた後、最後にJIT日の早い順に並べ替える（空欄は最後、同日は元の順）
    validate: (ws) => validateHRBToki(XLSX, ws),
    extract:  (ws) => extractJIT(XLSX, ws, { prefix: 'HRB', exclude: 'AESA', year: null, month: null }),
    columns: [{ key: 'month', label: 'AMD生産月' }, { key: 'model', label: '機種名' }, { key: 'serial', label: 'シリアル' },
      { key: 'dest', label: '仕向', value: 'EXP' }, { key: 'customer', label: '客先', value: 'AAI' }, { key: 'jit', label: 'JIT日', date: true, need: true }],
    outName: 'JIT日一覧',
    noMarkNote: n => `▲が見つからない行が${n}件あります。JIT日は空欄で出力します。`,
    emptyMsg: '抽出できる行がありませんでした。7行目以降のD列・F列にデータがあるか確認してください。',
  },
  '複合機': {
    allSheets: true,
    validate: (ws) => validateFukugo(XLSX, ws),
    extract:  (ws) => extractFukugo(XLSX, ws),
    columns: [{ key: 'month', label: 'アマダ生産月' }, { key: 'model', label: '機種名' }, { key: 'serial', label: 'シリアル' },
      { key: 'customer', label: '顧客名', wrap: true }, { key: 'panel', label: '制御盤納期', date: true, need: true }, { key: 'motor', label: 'モーター納期', date: true, need: true }],
    outName: '納期一覧',
    earliestYM: true,
    sortKey: 'panel', // EMLとACIESを合わせて制御盤納期の早い順（空欄は最後）
    noMarkNote: n => `「本4」または「本3」が見つからない行が${n}件あります。見つからない納期は空欄で出力します。`,
    emptyMsg: '抽出できる行がありませんでした。6行目以降のF列にデータがあるか確認してください。',
  },
};
// 機種が読むシート（allSheets の機種は空のシートを除くすべて）
function sheetsOf(f, proc){
  if (!proc || !proc.allSheets) return [f.sheet];
  return f.wb.SheetNames.filter(n => f.wb.Sheets[n] && f.wb.Sheets[n]['!ref']);
}

// 「HRB 土岐」のエラー定義
function validateHRBToki(XLSX, ws){
  const errs = [];
  if (!ws || !ws['!ref']) return ['シートにデータがありません。'];
  const range = XLSX.utils.decode_range(ws['!ref']);
  const val = (r, c) => { const cell = ws[XLSX.utils.encode_cell({ r, c })]; return cell ? cell.v : undefined; };
  const txt = v => (v === undefined || v === null) ? '' : String(v).trim();
  const P = 15, D = 3, F = 5;
  // 項目：ファイル上部（1〜5行目）に「○年○月」の生産年月
  let ym = false;
  for (let r = 0; r <= Math.min(range.e.r, 4) && !ym; r++)
    for (let c = 0; c <= Math.min(range.e.c, 10); c++)
      if (/\d{4}\s*年\s*\d{1,2}\s*月/.test(txt(val(r, c)))) { ym = true; break; }
  if (!ym) errs.push('項目の定義：1〜5行目に生産年月（「○年○月」）がありません。');
  // 列：P列以降があること
  if (range.e.c < P) { errs.push('列の定義：P列以降に日付の列がありません。'); return errs; }
  // 行：6行目のP列以降に日付
  let days = 0;
  for (let c = P; c <= range.e.c; c++) {
    const v = val(5, c);
    if (v instanceof Date || (typeof v === 'number' && v >= 1 && v <= 31) || /^\d{1,2}$/.test(txt(v))) days++;
  }
  if (!days) errs.push('行の定義：6行目（P列以降）に日付がありません。');
  // 行：5行目のP列以降に「○月」
  let months = 0;
  for (let c = P; c <= range.e.c; c++) if (/\d{1,2}\s*月/.test(txt(val(4, c)))) months++;
  if (!months) errs.push('行の定義：5行目（P列以降）に月（「○月」）がありません。');
  // 列：7行目以降のD列（機種名）・F列（シリアル）
  let dCnt = 0, fCnt = 0, marks = 0;
  for (let r = 6; r <= range.e.r; r++) {
    if (txt(val(r, D))) dCnt++;
    if (txt(val(r, F))) fCnt++;
    for (let c = P; c <= range.e.c; c++) if (txt(val(r, c)).includes('▲')) { marks++; break; }
  }
  if (!dCnt) errs.push('列の定義：7行目以降のD列に機種名がありません。');
  if (!fCnt) errs.push('列の定義：7行目以降のF列にシリアルがありません。');
  // 項目：▲の目印
  if (!marks) errs.push('項目の定義：P列以降に▲の目印が1つもありません。');
  return errs;
}
let machine = '';
let files = [], completed = false, lastRows = [], downloads = null, manualYM = false;

if (window.claude && window.claude.use) {
  window.claude.use('downloads').then(d => { downloads = d; refreshDl(); }).catch(() => {});
}
function refreshDl(){ $('dl').disabled = !lastRows.length; }
// エラー表示（C案）：見出し＋「原因」と「対処」を分けた項目
const ERR_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>';
function showErr(title, items){
  const e = $('err');
  if (!title) { e.hidden = true; e.innerHTML = ''; return; }
  const list = (items || []).map(it => `<div class="err-item"><div class="err-cause">${esc(it.cause)}</div>${it.detail ? `<ul class="err-detail">${it.detail.map(d => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}${it.fix ? `<div class="err-fix">→ ${esc(it.fix)}</div>` : ''}</div>`).join('');
  e.innerHTML = `<div class="err-title">${ERR_ICON}<span>${esc(title)}</span></div>${list}<div class="err-actions"><button type="button" class="err-ok">OK</button></div>`;
  e.querySelector('.err-ok').addEventListener('click', () => { showErr(''); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  e.hidden = false;
  requestAnimationFrame(() => e.scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
}
function fmt(d){ return d ? `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}` : ''; }
function esc(s){ const t=document.createElement('span'); t.textContent=s; return t.innerHTML; }
const baseOf = n => n.replace(/\.[^.]+$/, '').replace(/^_+|_+$/g,'');

async function addFiles(list){
  showErr('');
  if (typeof XLSX === 'undefined') { showErr('ファイルを読み込めません', [{ cause: 'Excel読み込み用のプログラムを読み込めませんでした', fix: 'ページを再読み込みしてください' }]); return; }
  const picked = Array.from(list).filter(f => /\.(xlsx|xlsm|xls)$/i.test(f.name));
  if (!picked.length) { showErr('ファイルを取り込めません', [{ cause: 'Excelファイルではありません', fix: '.xlsx / .xlsm / .xls のファイルを選んでください' }]); return; }
  const errs = [];
  for (const f of picked) {
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { cellDates:true });
      files.push({ name: f.name, wb, sheet: wb.SheetNames[0] });
    } catch(e) { errs.push(f.name); }
  }
  const items = [];
  if (errs.length) items.push({ cause: `読み込めなかったファイル：${errs.join('、')}`, fix: 'ファイルが壊れていないか、Excelで開けるか確認してください' });
  if (files.length > MAX_FILES) {
    const out = files.splice(0, files.length - MAX_FILES).map(x => x.name);
    items.push({ cause: `取り込めるのは4つまでのため、${out.join('、')} を外しました`, fix: '必要なファイルを選んでファイルクリアし、入れ替えてください' });
  }
  files.forEach(f => f.invalid = false); completed = false; renderSlots(); run();
  const dup = dupItem();
  if (dup) { markSlots(); showErr('ファイルが重複しています', [dup, ...items]); return; }
  showErr(items.length ? 'ファイルの取り込みで問題がありました' : '', items);
}
// 同じタイトル（ファイル名。拡張子・大文字小文字・全角半角の違いは無視）のファイルが2つ以上あれば重複。
// 重複したファイルには dup を付けて赤枠にし、エラー表示用の項目を返す（重複が無ければ null）
const titleKey = n => baseOf(n).normalize('NFKC').trim().toLowerCase();
function dupItem(){
  const cnt = {};
  files.forEach(f => { const k = titleKey(f.name); cnt[k] = (cnt[k] || 0) + 1; });
  files.forEach(f => f.dup = cnt[titleKey(f.name)] > 1);
  const names = [...new Set(files.filter(f => f.dup).map(f => baseOf(f.name)))];
  return names.length ? { cause: `ファイルが重複しています（${names.join('、')}）`, fix: '重複しているファイルのどちらかを選択し、ファイルクリアボタンを押してください' } : null;
}

function markSlots(){ document.querySelectorAll('#files .slot').forEach((el, i) => el.classList.toggle('invalid', !!(files[i] && (files[i].invalid || files[i].dup)))); }
function removeFile(i){ files.splice(i,1); completed = false; renderSlots(); run(); }

function renderSlots(){
  const box = $('files'); box.innerHTML = '';
  for (let i = 0; i < MAX_FILES; i++) {
    const f = files[i], d = document.createElement('div');
    if (!f) { d.className = 'slot empty'; d.textContent = `ファイル${i+1}：未選択`; box.appendChild(d); continue; }
    d.className = 'slot';
    d.classList.toggle('picked', !!f.picked);
    d.innerHTML = `<button type="button" class="head pick" aria-pressed="${f.picked ? 'true' : 'false'}" title="クリックで選択／解除"><span class="name">${esc(f.name)}</span></button>`;
    if (f.wb.SheetNames.length > 1 && !(PROCESSORS[machine] || {}).allSheets) { // 全シートを読む機種ではシート選択を出さない
      const sel = document.createElement('select'); sel.setAttribute('aria-label', 'シート');
      f.wb.SheetNames.forEach(n => { const o=document.createElement('option'); o.textContent=n; if(n===f.sheet) o.selected=true; sel.appendChild(o); });
      sel.addEventListener('change', () => { f.sheet = sel.value; completed = false; run(); });
      d.appendChild(sel);
    }
    const pk = d.querySelector('.pick');
    pk.addEventListener('click', () => { f.picked = !f.picked; pk.setAttribute('aria-pressed', f.picked); d.classList.toggle('picked', f.picked); updateFclear(); });
    box.appendChild(d);
  }
  const n = files.length;
  $('dropTitle').textContent = n === 0 ? 'Excelファイルを選ぶ（4つまで）' : n < MAX_FILES ? `あと${MAX_FILES - n}つファイルを追加できます` : '4つのファイルを取り込み済み';
  $('dropSub').textContent = n < MAX_FILES
    ? '画面のどこにでもドラッグ＆ドロップできます。複数まとめて選ぶこともできます（.xlsx / .xlsm / .xls）'
    : '入れ替えるときは、外したいファイル名をクリックして選び、「ファイルクリア」を押してから追加してください';
  updateFclear();
}
function updateDone(){ $('done').disabled = false; }
function updateFclear(){ $('fclear').disabled = !files.some(f => f.picked); }

function run(){
  updateDone(); updateFclear();
  if (!files.length || !completed) { $('result').hidden = true; lastRows = []; refreshDl(); return; }
  // 同じタイトルのファイルが重複していれば処理しない
  const dupFile = dupItem();
  if (dupFile) {
    completed = false; $('result').hidden = true; lastRows = []; refreshDl(); markSlots();
    showErr('ファイルが重複しています', [dupFile]);
    return;
  }
  const proc = PROCESSORS[machine];
  if (!proc) {
    completed = false; $('result').hidden = true; lastRows = []; refreshDl();
    showErr('処理を開始できません', [machine ? { cause: `「${machine.replace('　',' ')}」の処理はまだ設定されていません`, fix: '処理が設定済みの機種を選んでください' } : { cause: '機種が選択されていません', fix: '機種選択から1つ選んでください' }]);
    return;
  }
  // 機種ごとに必要なファイルの数
  if (proc.fileCount && files.length !== proc.fileCount) {
    completed = false; $('result').hidden = true; lastRows = []; refreshDl();
    showErr('処理を開始できません', [{ cause: `「${machine.replace('　',' ')}」はファイルが${proc.fileCount}つ必要です（今は${files.length}つ）`,
      fix: files.length < proc.fileCount ? `ファイルをあと${proc.fileCount - files.length}つ取り込んでください` : '不要なファイルを選んでファイルクリアしてください' }]);
    return;
  }
  // 機種の定義とファイルのアンマッチを確認
  const bad = [];
  files.forEach((f, i) => {
    const names = sheetsOf(f, proc);
    const e = names.length ? names.flatMap(n => proc.validate(f.wb.Sheets[n]).map(x => names.length > 1 ? `シート「${n}」　${x}` : x)) : ['シートにデータがありません。'];
    f.invalid = e.length > 0;
    if (e.length) bad.push({ cause: `ファイル${i+1}（${f.name}）が「${machine.replace('　',' ')}」の定義と合いません`, detail: e, fix: '選んだ機種が正しいか、正しいファイルかを確認し、違う場合はファイルを選んでファイルクリアしてください' });
  });
  markSlots();
  if (bad.length) {
    completed = false; $('result').hidden = true; lastRows = []; refreshDl();
    showErr('処理を開始できません', bad);
    return;
  }
  const all = [], excluded = [], notes = [];
  let noMarkCount = 0, ymKey = 0; lastYM = '';
  files.forEach((f, i) => {
    const names = sheetsOf(f, proc);
    names.forEach(n => {
      const label = names.length > 1 || proc.allSheets ? `ファイル${i+1}・${n}` : `ファイル${i+1}`;
      const res = proc.extract(f.wb.Sheets[n]);
      if (res.error) { notes.push(['warn', `${label}（${f.name}）：${res.error}`]); return; }
      // 保存名の年月：通常は最初のファイル、earliestYM の機種は最も早い生産月
      if (res.prodYear) {
        const k = res.prodYear * 12 + res.prodMonth;
        if (!ymKey || (proc.earliestYM && k < ymKey)) { ymKey = k; lastYM = `${res.prodYear}年${res.prodMonth}月`; }
      }
      if (!res.prodYear && !proc.earliestYM) notes.push(['warn', `${label}（${f.name}）：生産年月を読み取れなかったため、今年の日付として扱っています。`]);
      res.rows.forEach(x => all.push({ ...x, file: label, fileNo: i }));
      res.excluded.forEach(x => excluded.push({ ...x, file: label, fileNo: i }));
      noMarkCount += res.noMark.length;
    });
  });
  if (proc.sortKey) {
    const t = x => x[proc.sortKey] ? x[proc.sortKey].getTime() : Infinity;
    all.sort((a, b) => t(a) - t(b)); // 同じ日付は元の順のまま
  }
  lastRows = all;
  if (noMarkCount) notes.push(['info', proc.noMarkNote(noMarkCount)]);
  const seen = {}, dup = new Set();
  all.forEach(x => { if (!x.serial) return; const k = x.model + '|' + x.serial; if (seen[k] !== undefined && seen[k] !== x.fileNo) dup.add(x.serial); if (seen[k] === undefined) seen[k] = x.fileNo; });
  if (dup.size) notes.push(['info', `複数のファイルに同じ機種名・シリアルの行が${dup.size}件あります（${[...dup].slice(0,5).join('、')}${dup.size>5?' ほか':''}）。両方とも出力しています。`]);
  $('count').innerHTML = `<b>${all.length}</b>件を抽出<span>除外 ${excluded.length}件</span>`;
  $('notes').innerHTML = notes.map(([k,t]) => `<div class="note ${k}">${esc(t)}</div>`).join('');
  const cols = proc.columns;
  $('thead').innerHTML = `<tr>${cols.map(c => `<th>${esc(c.label)}</th>`).join('')}<th>元のファイル・行</th></tr>`;
  $('tbody').innerHTML = all.map(x =>
    `<tr class="${cols.some(c => c.need && !colVal(c, x)) ? 'nomark' : ''}">${cols.map(c => c.date
      ? `<td class="date">${fmt(colVal(c, x)) || '—'}</td>` : `<td${c.wrap ? ' class="wrap"' : ''}>${esc(colVal(c, x) ?? '')}</td>`).join('')}<td class="src">${esc(x.file)}・${x.row}行目</td></tr>`).join('')
    || `<tr><td colspan="${cols.length + 1}">${esc(proc.emptyMsg)}</td></tr>`;
  $('exWrap').hidden = !excluded.length;
  $('exSum').textContent = `除外した行（${excluded.length}件）`;
  $('exList').innerHTML = excluded.map(x => `<div>${x.file}・${x.row}行目：${esc(x.model)}／${esc(x.serial)}（${esc(x.reason)}）</div>`).join('');
  // 結果の表（プレビュー）は画面に出さない。件数と注意は保存画面の上に出す
  lastInfo = { count: all.length, excluded: excluded.length, notes };
  refreshDl();
}

// 保存ダイアログ（ファイル名を任意で付けて保存）
let lastYM = '', lastInfo = null;
// 保存ファイル名の初期値：「選択機種AMD生産計画 作成日（処理した日、2026.10.01形式）」（全機種共通）
function defaultName(){
  const m = machine ? machine.replace(/\s|　/g, '') : 'アマダ';
  const d = new Date(), p2 = n => String(n).padStart(2, '0');
  return `${m}AMD生産計画 ${d.getFullYear()}.${p2(d.getMonth() + 1)}.${p2(d.getDate())}`;
}
function openSave(){
  if (!lastRows.length) return;
  $('saveInfo').innerHTML = lastInfo ? `<div class="save-count"><b>${lastInfo.count}</b>件を抽出（除外 ${lastInfo.excluded}件）</div>` + lastInfo.notes.map(([k, t]) => `<div class="note ${k}">${esc(t)}</div>`).join('') : '';
  $('saveName').value = defaultName();
  $('saveMsg').textContent = ''; $('saveMsg').className = 'save-msg';
  $('saveDlg').hidden = false;
  setTimeout(() => { const i = $('saveName'); i.focus(); i.select(); }, 0);
}
function closeSave(){ $('saveDlg').hidden = true; }
async function doSave(){
  let name = $('saveName').value.trim().replace(/\.xlsx$/i, '');
  const msg = $('saveMsg');
  if (!name) { msg.textContent = 'ファイル名を入力してください'; msg.className = 'save-msg ng'; $('saveName').focus(); return; }
  if (/[\\/:*?"<>|]/.test(name)) { msg.textContent = 'ファイル名に \\ / : * ? " < > | は使えません'; msg.className = 'save-msg ng'; $('saveName').focus(); return; }
  const filename = name + '.xlsx';
  const data = buildWorkbook(XLSX, lastRows, PROCESSORS[machine]);
  if (downloads){
    try {
      await downloads.save({ filename, data: new Blob([data]) });
      closeSave(); showDone(filename);
    } catch(e){
      if (e && e.code === 'declined') { msg.textContent = '保存を取り消しました'; msg.className = 'save-msg'; return; }
      if (e && e.code === 'rate_limited') { msg.textContent = '保存の確認画面がすでに開いています。少し待ってからもう一度押してください'; msg.className = 'save-msg ng'; return; }
      closeSave(); showErr('保存できません', [{ cause: 'この画面ではファイルを保存できませんでした' }]);
    }
    return;
  }
  try{
    const url = URL.createObjectURL(new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    closeSave(); showDone(filename);
  }catch(e){ closeSave(); showErr('保存できません', [{ cause: 'この画面ではファイルを保存できませんでした' }]); }
}
function showDone(filename){
  const d = $('saved'); d.textContent = `「${filename}」を保存しました`; d.hidden = false;
  clearTimeout(showDone.t); showDone.t = setTimeout(() => d.hidden = true, 6000);
  resetAll();
}
// 処理完了（保存が終わった時点）：取り込んだファイル・機種選択・抽出結果をクリアし、画面の最上部で次の処理を待つ
function resetAll(){
  files = []; completed = false; machine = '';
  document.querySelectorAll('input[name="machine"]').forEach(r => r.checked = false);
  showErr(''); renderSlots(); run(); updateDone();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}
$('dl').addEventListener('click', openSave);
$('saveOk').addEventListener('click', doSave);
$('saveCancel').addEventListener('click', closeSave);
$('saveName').addEventListener('keydown', e => { if (e.key === 'Enter') doSave(); if (e.key === 'Escape') closeSave(); });
$('saveName').addEventListener('input', () => { $('saveMsg').textContent = ''; });
$('saveDlg').addEventListener('click', e => { if (e.target.id === 'saveDlg') closeSave(); });

$('file').addEventListener('change', e => { if (e.target.files.length) addFiles(e.target.files); e.target.value=''; });

// ページ全体をドロップ先にする
const overlay = $('overlay');
let dragDepth = 0;
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files');
const hideOverlay = () => { dragDepth = 0; overlay.hidden = true; };
document.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; overlay.hidden = false; });
document.addEventListener('dragover', e => { if (!hasFiles(e)) return; e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; });
document.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth - 1); if (dragDepth === 0) hideOverlay(); });
document.addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); hideOverlay(); if (e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
window.addEventListener('blur', hideOverlay);
$('kw').addEventListener('input', run);
$('fclear').addEventListener('click', () => {
  if (!files.some(f => f.picked)) return;
  files = files.filter(f => !f.picked); completed = false; showErr('');
  files.forEach(f => f.invalid = false);
  renderSlots(); run();
  const dup = dupItem(); markSlots();
  if (dup) showErr('ファイルが重複しています', [dup]);
});
$('mclear').addEventListener('click', () => {
  document.querySelectorAll('input[name="machine"]').forEach(r => r.checked = false);
  machine = ''; updateDone(); showErr('');
  files.forEach(f => f.invalid = false); renderSlots(); markSlots();
  completed = false; run();
});
$('done').addEventListener('click', () => {
  const miss = [];
  if (!files.length) miss.push({ cause: 'ファイルが取り込まれていません', fix: '上の枠にExcelファイルをドラッグするか、クリックして選んでください' });
  if (!machine) miss.push({ cause: '機種が選択されていません', fix: '機種選択から1つ選んでください' });
  if (miss.length) { completed = false; run(); showErr('処理を開始できません', miss); return; }
  showErr(''); completed = true; run();
  if (completed) {
    if (lastRows.length) openSave();
    else showErr('保存できるデータがありません', [{ cause: '抽出できる行がありませんでした', fix: ((PROCESSORS[machine] || {}).emptyMsg || '').replace(/^抽出できる行がありませんでした。/, '') }]);
  }
});
renderSlots();
// 機種選択（ラジオボタン）。空欄は今後追加する機種用の空き枠
const MACHINES = [
  ['HG','EGB制御盤','EGB別盤','HRB　集計','HRB　土岐','HRB　KD','HRB　大型','HRB　ATC盤'],
  ['複合機','レーザ','AE','発振器','小板発振器','FLW','','']
];
(function renderMachines(){
  const g = $('mgrid');
  MACHINES.forEach(col => {
    const c = document.createElement('div'); c.className = 'mcol';
    col.forEach(name => {
      const l = document.createElement('label');
      l.className = 'opt' + (name ? '' : ' blank');
      const r = document.createElement('input'); r.type = 'radio'; r.name = 'machine'; r.value = name;
      if (!name) { r.disabled = true; r.setAttribute('aria-label', '空き'); }
      r.addEventListener('change', () => { machine = r.value; updateDone(); showErr(''); files.forEach(f => f.invalid = false); renderSlots(); markSlots(); if (completed) run(); });
      l.appendChild(r);
      const t = document.createElement('span'); t.textContent = name; l.appendChild(t);
      c.appendChild(l);
    });
    g.appendChild(c);
  });
})();
</script>
